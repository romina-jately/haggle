[project]
name = "haggle-api"
version = "0.1.0"
description = "Agentic storefront and negotiation service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haggle"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
