<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Haggle — chat with the seller</title>
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
  <div class="app-doodles" aria-hidden="true">
    <svg class="doodle a1" viewBox="0 0 40 40"><path d="M20 2 L24 16 L38 20 L24 24 L20 38 L16 24 L2 20 L16 16 Z" fill="#ffe93b" stroke="#111" stroke-width="2" stroke-linejoin="round"/></svg>
    <svg class="doodle a2" viewBox="0 0 44 60"><path d="M22 4 L34 24 L26 24 L38 42 L18 42 L6 42 L18 24 L10 24 Z" fill="#8bd63f" stroke="#111" stroke-width="2" stroke-linejoin="round"/><rect x="19" y="42" width="6" height="12" fill="#111"/></svg>
    <svg class="doodle a3" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="#fecb95" stroke="#111" stroke-width="2"/><circle cx="18" cy="22" r="2.4" fill="#111"/><circle cx="32" cy="22" r="2.4" fill="#111"/><path d="M16 30 Q25 40 34 30" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round"/></svg>
    <svg class="doodle a4" viewBox="0 0 44 40"><path d="M22 38 C6 26 2 14 12 8 C18 4 22 10 22 12 C22 10 26 4 32 8 C42 14 38 26 22 38 Z" fill="#d17aff" stroke="#111" stroke-width="2" stroke-linejoin="round"/></svg>
  </div>
  <div class="ticker">✦ shop secondhand · make an offer · an agent haggles back ✦</div>
  <header>
    <a href="index.html" style="text-decoration:none;color:inherit"><h1>Haggle</h1></a>
    <span class="tag">buyer view</span>
    <span class="mode" id="who">you: —</span>
  </header>

  <!-- catalog -->
  <section class="shop" id="catalog-view">
    <div class="shop-head">
      <h2>Shop</h2>
      <span class="muted small" id="shop-sub">Tap an item to message the seller. An agent answers and will haggle.</span>
    </div>
    <div class="grid" id="grid"><div class="empty">Loading listings…</div></div>
  </section>

  <!-- chat -->
  <section class="chatwrap" id="chat-view" hidden>
    <div class="chat-head">
      <span class="back" id="back" title="Back to shop">‹</span>
      <div class="thumb" id="c-thumb"></div>
      <div class="meta">
        <span class="nm" id="c-name"></span>
        <span class="pr" id="c-price"></span>
      </div>
    </div>
    <div class="trust">🔒 You're messaging the seller's negotiating agent. Offers are handled automatically.</div>
    <div class="thread" id="thread"></div>
    <div id="c-banner"></div>
    <div class="chat-composer" id="composer">
      <input id="c-text" placeholder="Make an offer, e.g. would you take $180?" />
      <button id="c-send">Send</button>
    </div>
  </section>

  <div class="toast" id="toast"></div>
  <script src="chat.js"></script>
</body>
</html>
