[project]
name = "haggle-negotiation"
version = "0.1.0"
description = "Score a model in the seller's negotiating seat against a deterministic buyer and the Haggle engine baseline."
tags = ["negotiation", "multi-turn", "user-sim", "pricing", "rl", "eval"]
requires-python = ">=3.11"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haggle_negotiation"]
